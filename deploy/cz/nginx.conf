server {
    listen 80;
    listen [::]:80;
    server_name dreamboard.ks-design.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dreamboard.ks-design.art$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dreamboard.ks-design.art;

    ssl_certificate /etc/letsencrypt/live/dreamboard.ks-design.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dreamboard.ks-design.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/dreamboard/current;
    index index.html;

    access_log /var/log/nginx/dreamboard.ks-design.art.access.log;
    error_log /var/log/nginx/dreamboard.ks-design.art.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.matecito.co; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
